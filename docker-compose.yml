version: '3.8'

services:
  gmgn-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmgn-tracker:latest
    container_name: gmgn-tracker
    # 避免端口冲突 - 这是一个 CLI 工具,不需要暴露端口
    # 如果未来添加 Web UI,可以使用非冲突端口如 8088
    ports: []
    volumes:
      # 挂载配置文件
      - ./config.yaml:/app/config.yaml:ro
      # 挂载日志目录
      - ./logs:/app/logs
      # 挂载缓存目录
      - ./cache:/app/.cache
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    # 资源限制 - 避免侵入其他服务
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # 重启策略
    restart: unless-stopped
    # 网络模式
    networks:
      - gmgn-network
    # healthcheck 健康检查
    healthcheck:
      test: ["CMD", "gmgn-tracker", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  gmgn-network:
    driver: bridge
    # 使用自定义网络,避免与其他服务冲突
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  logs:
  cache:
