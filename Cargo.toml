[package]
name = "gmgn-tracker"
version = "0.1.0"
edition = "2021"
authors = ["GMGN Tracker Team"]
description = "Smart money wallet tracker for GMGN.ai platform"
license = "MIT"

[[bin]]
name = "gmgn-tracker"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
serde_yaml = "0.9"

# Database (embedded)
sled = "0.34"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Async rate limiting
governor = "0.7"

# Terminal UI enhancements
colored = "2.2"
indicatif = "0.17"

# Random data generation
rand = "0.8"

[dev-dependencies]
mockito = "1.6"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
